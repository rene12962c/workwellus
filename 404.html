<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkWell Protection</title>
<script>/* GitHub Pages sirve este archivo para /said-palma, /jose-castillo, etc. y lo manda al portal, que lee el slug. */
(function(){var p=location.pathname.replace(/^\/+|\/+$/g,'');location.replace('/'+(/^[A-Za-z0-9-]+$/.test(p)?'?p='+encodeURIComponent(p):''));})();</script>
<noscript><meta http-equiv="refresh" content="0;url=/"></noscript></head><body></body></html>
