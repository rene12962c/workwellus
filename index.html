<style>
:root{--navy:#0d3c60;--navy-deep:#0b3c5e;--teal:#0da9bf;--teal-strong:#00acc5;--coral:#f4516a;--ice:#edfbfb;--ice-2:#f4fbfc;--pill:#dff3f8;--gray:#6b7785;--gray-2:#8a96a3;--gold:#f7b64a;--font-h:'Poppins',system-ui,sans-serif;--font-b:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-b);color:var(--navy);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}button{font-family:inherit;cursor:pointer;border:0;background:none}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{display:none}.view.active{display:block}
.hide{display:none!important}

/* HEADER */
.site-header{height:70px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3.5vw,48px);position:relative;z-index:6}
.brand img{height:38px;width:auto}
.nav-right{display:flex;align-items:center;gap:24px}
.lang{display:flex;align-items:center;gap:6px;font:700 11px var(--font-h);color:var(--gray-2)}
.lang button{font:700 11px var(--font-h);color:var(--gray-2);padding:2px}
.lang button.on{color:var(--teal)}
.verified{display:flex;align-items:center;gap:7px;font:600 12px var(--font-h);color:var(--gray-2)}
.verified .ico{font-size:17px;color:var(--teal);stroke-width:1.8}
.call-btn{display:inline-flex;align-items:center;gap:8px;background:var(--coral);color:#fff;font:600 13px var(--font-h);padding:11px 22px;border-radius:12px;box-shadow:0 8px 20px rgba(244,81,106,.3);transition:transform .15s}
.call-btn:hover{transform:translateY(-1px)}.call-btn .ico{font-size:16px}

/* HERO */
.hero{background:var(--ice) var(--herobg) center top/cover no-repeat;position:relative;padding:62px 0 150px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(237,251,251,.55),rgba(237,251,251,.15))}
.wrap{width:min(1040px,100% - 40px);margin:0 auto;position:relative}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:34px;align-items:start}
.eyebrow{display:flex;align-items:center;gap:10px;font:700 15px var(--font-h);letter-spacing:.14em;color:var(--teal);text-transform:uppercase}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--coral);flex:none}
.hero h1{font:800 clamp(36px,5vw,58px)/1.06 var(--font-h);letter-spacing:-.035em;margin:12px 0 22px;color:var(--navy)}
.hero h1 span{display:block;white-space:nowrap}.hero h1 em{font-style:normal;color:var(--teal)}
.hero p.lead{font:500 15px/1.6 var(--font-h);color:var(--navy);max-width:440px}
.checks{display:flex;gap:18px;margin-top:22px;font:500 11px var(--font-h);color:var(--navy);flex-wrap:wrap}
.checks .ico{display:inline;width:12px;height:12px;color:var(--teal);stroke-width:3;vertical-align:-1px;margin-right:3px}
.feat-card{background:#fff;border-radius:34px;box-shadow:0 22px 60px rgba(13,169,191,.16);padding:24px 26px 20px}
.feat-card header{display:flex;justify-content:space-between;align-items:center;padding:0 0 12px}
.feat-card h3{font:600 15px var(--font-h)}
.tag-mini{font:700 10px var(--font-h);letter-spacing:.06em;color:var(--teal);background:var(--pill);padding:5px 11px;border-radius:999px}
.feat-row{display:flex;align-items:center;gap:13px;padding:9px 0}
.avatar{width:52px;height:52px;border-radius:14px;overflow:hidden;flex:none;background:#d8f2f6;display:flex;align-items:flex-end;justify-content:center;color:var(--teal);font:700 18px var(--font-h)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:top center}
.avatar.ini{align-items:center}
.feat-row .meta{flex:1;min-width:0}
.feat-row .meta b{display:block;font:600 13.5px var(--font-h)}
.feat-row .meta small{display:block;font:500 10.5px/1.35 var(--font-h);color:var(--gray)}
.feat-row .ct{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--font-h);color:var(--teal);white-space:nowrap}
.feat-row .ct .ico{font-size:14px}
.stars{color:var(--gold);letter-spacing:1px;font-size:12px;white-space:nowrap}

.search-box{position:relative;z-index:3;width:min(1000px,100% - 40px);margin:-92px auto 0;background:#fff;border-radius:40px;box-shadow:0 24px 70px rgba(13,169,191,.18);padding:30px 34px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:14px;align-items:end}
.field label{display:block;font:700 10.5px var(--font-h);letter-spacing:.1em;color:var(--navy);margin:0 0 7px 2px;text-transform:uppercase}

.ovl{position:fixed;inset:0;background:rgba(11,60,94,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}

.modal .err{color:#c0392b;font:500 12px var(--font-h);margin-bottom:8px;display:none}
.hp{position:absolute;left:-9999px;opacity:0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font:600 13px var(--font-h);padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60}

}

function load(){
  if(!SB_KEY){AGENTS=DEMO.slice();DEMO_MODE=true;return Promise.resolve();}
  rest('site_settings?select=key,value_es,value_en').then(function(l){(l||[]).forEach(function(r){CFG[r.key]=r});
    var g=function(k){return CFG[k]&&CFG[k].value_es||''};
    COMPANY_PHONE=g('company_phone')||COMPANY_PHONE;BOOK_URL=g('booking_url')||BOOK_URL;QUALIFY_URL=g('qualify_url')||QUALIFY_URL;FACEBOOK_URL=g('facebook_url')||FACEBOOK_URL;INSTAGRAM_URL=g('instagram_url')||INSTAGRAM_URL;
    applyI18n();route();}).catch(function(){});
  return Promise.all([
    rest('agents?select=*&published=eq.true&order=full_name.asc'),
    rest('agent_rating_summary?select=*').catch(function(){return []})
  ]).then(function(r){AGENTS=r[0]||[];(r[1]||[]).forEach(function(x){RATING[x.agent_id]=x});}).catch(function(){AGENTS=DEMO.slice();DEMO_MODE=true;});
}

/* ============ RENDER: i18n estático ============ */
function applyI18n(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=T(e.getAttribute('data-t'))});
  document.querySelectorAll('[data-ph]').forEach(function(e){e.placeholder=T(e.getAttribute('data-ph'))});
  document.getElementById('l-es').classList.toggle('on',lang==='es');document.getElementById('l-en').classList.toggle('on',lang==='en');
  var cb=document.getElementById('callBtn');cb.href=COMPANY_PHONE?telHref(COMPANY_PHONE):'#contacto';
  ['fb','ig'].forEach(function(k){var u=k==='fb'?FACEBOOK_URL:INSTAGRAM_URL,a=document.getElementById(k+'L');if(u){a.href=u;a.target='_blank';a.rel='noopener'}else a.classList.add('hide')});
  buildStateSelect();
}
function buildStateSelect(){
  var sel=document.getElementById('q-estado'),cur=sel.value;
  var codes=Object.keys(ST).sort(function(a,b){return stName(a).localeCompare(stName(b),lang)});
  sel.innerHTML='<option value="">'+esc(T('statePh'))+'</option>'+codes.map(function(c){return '<option value="'+c+'">'+esc(stName(c))+'</option>'}).join('');
  sel.value=cur;
}

/* ============ RENDER: HOME ============ */
function agentCard(a){
  var r=RATING[a.id],title=lang==='en'?a.leader_title_en:a.leader_title_es,bio=lang==='en'?a.leader_bio_en:a.leader_bio_es;
  var states=(a.states||[]).slice(0,3).map(stName).join(', ');
  var tel=telHref(a.phone),contact=tel?'<a class="fill" href="'+esc(tel)+'"><svg class="ico"><use href="#i-phone"/></svg>'+T('contact')+'</a>':'<a class="fill" href="/'+esc(a.slug)+'" data-nav="/'+esc(a.slug)+'"><svg class="ico"><use href="#i-phone"/></svg>'+T('contact')+'</a>';
  return '<article class="pcard">'+
    '<div class="top">'+avatar(a)+'<div><b>'+esc(a.full_name)+'</b><small>'+esc(title||roleOf(a))+'</small></div></div>'+
    '<div class="rate">'+(r?'<span class="stars">'+stars(r.avg_rating)+'</span>'+esc(r.avg_rating):'')+'</div>'+
    '<p>'+esc(bio||(states?(a.npn?'NPN '+a.npn+' · ':'')+states:(a.npn?'NPN '+a.npn:'')))+'</p>'+
    '<div class="pbtns">'+contact+'<a class="line" href="/'+esc(a.slug)+'" data-nav="/'+esc(a.slug)+'">'+T('viewProfile')+'</a></div></article>';
}
function renderHome(){
  var feat=AGENTS.filter(function(a){return a.featured}).sort(function(x,y){return (x.featured_order||100)-(y.featured_order||100)}).slice(0,5);
  document.querySelector('.feat-card').classList.toggle('hide',!feat.length);
  document.getElementById('featList').innerHTML=feat.map(function(a){
    var tel=telHref(a.phone);
    return '<div class="feat-row">'+avatar(a)+'<div class="meta"><b>'+esc(a.full_name)+'</b><small>'+esc(T('brokerRole'))+(a.npn?'<br>NPN '+esc(a.npn):'')+'</small></div>'+

  }).join('');
  var lead=AGENTS.filter(function(a){return a.leadership}).sort(function(x,y){return (x.leadership_order||100)-(y.leadership_order||100)});
  document.getElementById('leaders').innerHTML=lead.map(agentCard).join('');
  document.getElementById('profesionales').classList.toggle('hide',!lead.length);
  var q=currentQuery();if(q)runSearch();
}
function currentQuery(){return {e:document.getElementById('q-estado').value,n:norm(document.getElementById('q-npn').value),m:norm(document.getElementById('q-nombre').value)}}
function runSearch(){
  var q=currentQuery(),box=document.getElementById('results');
  if(!q.e&&!q.n&&!q.m){box.classList.add('hide');return}
  var list=AGENTS.filter(function(a){
    return (!q.e||(a.states||[]).indexOf(q.e)>-1)&&(!q.n||norm(a.npn).indexOf(q.n)>-1)&&(!q.m||norm(a.full_name).indexOf(q.m)>-1);
  });
  box.classList.remove('hide');
  document.getElementById('resultsGrid').innerHTML=list.map(agentCard).join('');
  document.getElementById('noresult').classList.toggle('hide',list.length>0);
}

   '<div class="body"><div class="p-photo'+(photo(a)?'':' ini')+'">'+(photo(a)?'<img src="'+esc(photo(a))+'" alt="'+esc(a.full_name)+'">':esc(initials(a.full_name)))+'</div>'+
   '<div class="p-head"><div><h2>'+esc(a.full_name)+'</h2><div class="role">'+esc(roleOf(a))+'</div></div><button class="share" id="shareBtn"><svg class="ico"><use href="#i-share"/></svg>'+esc(T('share'))+'</button></div>'+
   '<div class="info">'+row('i-phone',esc(T('phone')),a.phone)+row('i-mail',esc(T('mail')),a.email)+row('i-globe',esc(T('npn')),a.npn)+row('i-pin',esc(T('res')),resLabel(a.residence))+'</div>'+
   '<hr class="sep"><div class="trio">'+licTypeRow(a)+row('i-globe',esc(T('langs')),langTxt)+
   '<div class="irow"><span class="ic"><svg class="ico" style="fill:currentColor;stroke:none"><use href="#i-star"/></svg></span><div><small>'+esc(T('spec'))+'</small><b class="teal">'+(specs?esc(specs):'—')+'</b></div></div></div>'+
   '<hr class="sep"><div class="lic-head"><h3>'+esc(T('licHead'))+'</h3><span>'+esc(T('licNote'))+'</span></div>'+
   '<div class="lic-list" id="licList">'+licChips(a,{})+'</div>'+
   '<hr class="sep"><div id="revBox"></div></div></article>'+
   '<div class="pf-cta">'+(tel?'<a class="ll" href="'+esc(tel)+'"><svg class="ico"><use href="#i-phone"/></svg>'+esc(T('call'))+'</a>':'')+(book?'<a class="ag" href="'+esc(book)+'" '+((calOk||BOOK_URL)?'target="_blank" rel="noopener noreferrer"':'')+'><svg class="ico"><use href="#i-cal"/></svg>'+esc(T('book'))+'</a>':'')+'</div></div>'+
   '<aside class="side"><div class="help"><small class="k">'+esc(T('need').toUpperCase())+'</small><h3>'+esc(T('hereT'))+'</h3><a href="'+(COMPANY_PHONE?esc(telHref(COMPANY_PHONE)):'#contacto')+'"><svg class="ico"><use href="#i-phone"/></svg>'+esc(T('talk'))+'</a></div>'+
   '<div class="trust"><div class="sh"><svg class="ico"><use href="#i-shield"/></svg></div><h4>'+esc(T('trustT'))+'</h4><p>'+esc(T('trustP'))+'</p><a href="'+NPN_LOOKUP+'" target="_blank" rel="noopener">'+esc(T('verifyNpn'))+'</a></div>'+
   '<div class="qual"><small class="k">'+esc(T('qualK').toUpperCase())+'</small><h3>'+esc(T('qualH'))+'</h3><a href="'+(QUALIFY_URL?esc(QUALIFY_URL):'mailto:protection@workwellus.com')+'" '+(QUALIFY_URL?'target="_blank" rel="noopener"':'')+'>'+esc(T('click'))+' <svg class="ico"><use href="#i-right"/></svg></a></div></aside></div>';
  document.getElementById('shareBtn').onclick=function(){var url='https://workwellus.com/'+a.slug;if(navigator.share){navigator.share({title:a.full_name+' | WorkWell Protection',url:url}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){toast(T('linkCopied'))},function(){})}};
  wireProfileSearch();loadReviews(a);loadLicDocs(a);
}
function licTypeLabel(v){return (v&&STR[lang].lt[v])||v}
function resLabel(v){var c=String(v||'').trim().toUpperCase();return ST[c]?stName(c):v}
function licTypeRow(a){
  var ok=/^https?:\/\//i.test(a.license_url||''),v=licTypeLabel(a.license_type);
  var val=!v?'':(ok?'<a class="lic-link" href="'+esc(a.license_url)+'" target="_blank" rel="noopener noreferrer">'+esc(v)+'<svg class="ico"><use href="#i-ext"/></svg></a>':'<span>'+esc(v)+'</span>');
  val=val||'—';
  return '<div class="irow"><span class="ic"><svg class="ico"><use href="#i-shield"/></svg></span><div><small>'+esc(T('licType'))+'</small><b>'+val+'</b></div></div>';
}
function licChips(a,docs){
  if(!(a.states||[]).length)return '<span style="font:500 12px var(--font-h);color:var(--gray)">—</span>';
  return a.states.map(function(c){var u=docs[c],ic='<svg class="ico"><use href="#i-doc"/></svg>';
    return /^https:\/\//.test(u||'')?'<a class="lic" href="'+esc(u)+'" target="_blank" rel="noopener">'+ic+esc(stName(c))+'</a>':'<span class="lic">'+ic+esc(stName(c))+'</span>'}).join('');
}
function loadLicDocs(a){
  if(!SB_KEY||!a.profile_ref)return;
  rest('agent_license_docs?select=state,url&profile_ref=eq.'+encodeURIComponent(a.profile_ref)).then(function(l){
    var d={};(l||[]).forEach(function(r){d[r.state]=r.url});var el=document.getElementById('licList');if(el&&CUR===a)el.innerHTML=licChips(a,d);
  }).catch(function(){});
}
function loadReviews(a){
  var box=document.getElementById('revBox');if(!box)return;
  var draw=function(list){
    var r=RATING[a.id],head='<div class="rev-head"><b>'+esc(T('reviews'))+'</b>'+(r&&r.review_count?'<span class="stars">'+stars(r.avg_rating)+'</span><span class="score">'+esc(r.avg_rating)+'</span>('+esc(T('based'))+' '+r.review_count+' '+esc(T('revWord'))+')':'')+
      '<button class="wr" id="wrBtn"><svg class="ico"><use href="#i-edit"/></svg>'+esc(T('write'))+'</button></div>';
    box.innerHTML=head+'<div class="revs">'+(list.length?list.map(function(v){return '<div class="rev"><span class="stars">'+stars(v.rating)+'</span><q>“'+esc(v.comment)+'”</q><small>'+esc(v.author_name)+'</small></div>'}).join(''):'<div class="norev">'+esc(T('noRev'))+'</div>')+'</div>';
    document.getElementById('wrBtn').onclick=openReview;
  };
  draw([]);
  if(SB_KEY&&a.id)rest('agent_reviews?select=rating,comment,author_name&agent_id=eq.'+encodeURIComponent(a.id)+'&order=created_at.desc&limit=3').then(function(l){draw(l||[])}).catch(function(){});
}
function wireProfileSearch(){
  var inp=document.getElementById('pfSearch'),sg=document.getElementById('sugg');
  var find=function(v){v=norm(v);return v?AGENTS.filter(function(a){return norm(a.full_name).indexOf(v)>-1||norm(a.npn).indexOf(v)>-1}).slice(0,6):[]};
  inp.addEventListener('input',function(){var l=find(inp.value);sg.innerHTML=l.map(function(a){return '<a href="/'+esc(a.slug)+'" data-nav="/'+esc(a.slug)+'">'+esc(a.full_name)+(a.npn?' <small>· NPN '+esc(a.npn)+'</small>':'')+'</a>'}).join('');sg.style.display=l.length?'block':'none'});
  inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){var l=find(inp.value);if(l.length)go('/'+l[0].slug);else{go('/');document.getElementById('q-nombre').value=inp.value;runSearch();}}});
}

/* ============ RESEÑAS ============ */
var pick=0;
function openReview(){
  pick=0;document.getElementById('rv-name').value='';document.getElementById('rv-text').value='';document.getElementById('rv-err').style.display='none';
  paintStars();document.getElementById('revOvl').classList.add('open');
}
function paintStars(){var sp=document.getElementById('starPick');sp.innerHTML=[1,2,3,4,5].map(function(i){return '<button type="button" data-v="'+i+'" class="'+(i<=pick?'on':'')+'" aria-label="'+i+'">★</button>'}).join('');sp.querySelectorAll('button').forEach(function(b){b.onclick=function(){pick=+b.dataset.v;paintStars()}})}
document.getElementById('rv-cancel').onclick=function(){document.getElementById('revOvl').classList.remove('open')};
document.getElementById('revOvl').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open')});
document.getElementById('revForm').addEventListener('submit',function(ev){
  ev.preventDefault();var er=document.getElementById('rv-err'),name=document.getElementById('rv-name').value.trim(),text=document.getElementById('rv-text').value.trim();
  var fail=function(m){er.textContent=m;er.style.display='block'};
  if(!pick)return fail(T('wrErrR'));if(!name)return fail(T('wrErrN'));if(text.length<5)return fail(T('wrErrT'));
  if(document.getElementById('rv-hp').value)return;               /* trampa anti-bots */
  try{if(localStorage.getItem('ww_rv_'+CUR.slug)&&Date.now()-(+localStorage.getItem('ww_rv_'+CUR.slug))<60000)return fail(T('wrFail'))}catch(e){}
  var btn=document.getElementById('rv-send');btn.disabled=true;
  var done=function(ok){btn.disabled=false;if(ok){document.getElementById('revOvl').classList.remove('open');toast(T('wrOk'));try{localStorage.setItem('ww_rv_'+CUR.slug,String(Date.now()))}catch(e){}}else fail(T('wrFail'))};
  if(!SB_KEY||!CUR.id){done(true);return}
  rest('agent_reviews',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({agent_id:CUR.id,rating:pick,author_name:name,comment:text})}).then(function(){done(true)},function(){done(false)});
});

/* ============ ROUTER (rutas limpias: /said-palma) ============ */
function slugFromLocation(){
  var p=new URLSearchParams(location.search).get('p');
  if(p){var s=p.replace(/^\/+|\/+$/g,'').toLowerCase();if(/^[a-z0-9-]+$/.test(s)){try{history.replaceState(null,'','/'+s)}catch(e){}return s}}
  var h=location.hash.match(/^#\/agente\/([a-z0-9-]+)/);if(h)return h[1];            /* enlaces antiguos */
  var path=location.pathname.replace(/^\/+|\/+$/g,'').toLowerCase();
  return /^[a-z0-9-]+$/.test(path)&&path!=='index'?path:'';
}
function go(path){
  var hash='';if(path.indexOf('#')>-1){hash=path.slice(path.indexOf('#'));path=path.slice(0,path.indexOf('#'))}
  try{history.pushState(null,'',path)}catch(e){}
  route();
  if(hash==='#search'){document.getElementById('searchForm').scrollIntoView({behavior:'smooth',block:'center'})}else window.scrollTo(0,0);
}
function route(){
  var slug=slugFromLocation(),home=document.getElementById('view-home'),prof=document.getElementById('view-profile');
  home.classList.toggle('active',!slug);document.getElementById('ctaWrap').classList.toggle('hide',!!slug);prof.classList.toggle('active',!!slug);
  if(slug)renderProfile(slug);else document.title='WorkWell Protection | Portal de agentes';
}
document.addEventListener('click',function(ev){
  var a=ev.target.closest&&ev.target.closest('[data-nav]');if(!a||ev.metaKey||ev.ctrlKey||ev.shiftKey)return;
  ev.preventDefault();go(a.getAttribute('data-nav'));
});
document.addEventListener('click',function(ev){var s=document.getElementById('sugg');if(s&&!ev.target.closest('.pf-search'))s.style.display='none'});
window.addEventListener('popstate',route);

/* ============ EVENTOS ============ */
document.getElementById('searchForm').addEventListener('submit',function(ev){ev.preventDefault();runSearch();var r=document.getElementById('results');if(!r.classList.contains('hide'))r.scrollIntoView({behavior:'smooth'})});
document.getElementById('modify').addEventListener('click',function(ev){ev.preventDefault();document.getElementById('searchForm').scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('q-nombre').focus({preventScroll:true})});
document.getElementById('nextBtn').addEventListener('click',function(){var c=document.getElementById('leaders');c.scrollBy({left:c.clientWidth*.9,behavior:'smooth'})});
function setLang(l){lang=l;try{localStorage.setItem('ww_lang',l)}catch(e){}applyI18n();renderHome();route()}
document.getElementById('l-es').onclick=function(){setLang('es')};document.getElementById('l-en').onclick=function(){setLang('en')};

applyI18n();
load().then(function(){renderHome();route()});
})();
</script>
